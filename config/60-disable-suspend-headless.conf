# /etc/systemd/sleep.conf.d/60-disable-suspend-headless.conf
#
# A remote-only unit that suspends is a unit you cannot reach. Wake-on-LAN is
# not a reliable answer on these boxes. Belt-and-braces alongside masking the
# sleep targets in install-virtual-display.sh.

[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
